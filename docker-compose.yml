version: '3.8'

services:
  kali-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: kali-mcp:latest
    container_name: kali-mcp
    restart: unless-stopped
    cap_add:
      - NET_RAW
      - NET_ADMIN
    volumes:
      - ./workspace:/workspace
    working_dir: /workspace
    command: ["tail", "-f", "/dev/null"]
